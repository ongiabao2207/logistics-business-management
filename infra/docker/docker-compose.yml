name: logistics-business-management

services:
  traefik:
    image: traefik:v3.7.12
    restart: unless-stopped

    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "127.0.0.1:${TRAEFIK_HTTP_PORT:-80}:80"
      - "127.0.0.1:${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - gateway

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - gateway

  identity-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${IDENTITY_DB_NAME:-identity_db}
      POSTGRES_USER: ${IDENTITY_DB_USER:-identity_user}
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_password}
    ports:
      - "127.0.0.1:${IDENTITY_DB_PORT:-5436}:5432"
    volumes:
      - identity-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - identity-data

  identity-service:
    build:
      context: ../../services/identity-service
    restart: unless-stopped
    environment:
      IDENTITY_DATABASE_URL: postgresql+psycopg://${IDENTITY_DB_USER:-identity_user}:${IDENTITY_DB_PASSWORD:-identity_password}@identity-db:5432/${IDENTITY_DB_NAME:-identity_db}
      IDENTITY_JWT_PRIVATE_KEY_PATH: /run/secrets/jwt-private.pem
      IDENTITY_JWT_PUBLIC_KEY_PATH: /run/secrets/jwt-public.pem
      IDENTITY_JWT_ISSUER: identity-service
      IDENTITY_JWT_AUDIENCE: logistics-api
      IDENTITY_ACCESS_TOKEN_TTL_MINUTES: 15
      IDENTITY_RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/%2F
      IDENTITY_RABBITMQ_ENABLED: "true"
    ports:
      - "127.0.0.1:${IDENTITY_SERVICE_PORT:-8005}:8000"
    volumes:
      - ../../services/identity-service/secrets:/run/secrets:ro
    depends_on:
      identity-db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.docker.network=lbm-gateway
      - traefik.http.routers.identity.rule=Host(`identity.localhost`) || PathPrefix(`/api/v1/auth`) || PathPrefix(`/api/v1/accounts`) || PathPrefix(`/api/v1/roles`) || PathPrefix(`/.well-known/jwks.json`)
      - traefik.http.routers.identity.entrypoints=web
      - traefik.http.services.identity.loadbalancer.server.port=8000
    networks:
      - gateway
      - identity-data

  contract-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CONTRACT_DB_NAME:-contract_db}
      POSTGRES_USER: ${CONTRACT_DB_USER:-contract_user}
      POSTGRES_PASSWORD: ${CONTRACT_DB_PASSWORD:-contract_password}
    ports:
      - "127.0.0.1:${CONTRACT_DB_PORT:-5432}:5432"
    volumes:
      - contract-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - contract-data

  contract-service:
    build:
      context: ../../services/contract-service
    restart: unless-stopped
    environment:
      CONTRACT_SERVICE_DATABASE_URL: postgresql+psycopg://${CONTRACT_DB_USER:-contract_user}:${CONTRACT_DB_PASSWORD:-contract_password}@contract-db:5432/${CONTRACT_DB_NAME:-contract_db}
      CONTRACT_SERVICE_CUSTOMER_CLIENT_MODE: http
      CONTRACT_SERVICE_CUSTOMER_SERVICE_URL: http://customer-service:8000/api/v1
      CONTRACT_SERVICE_CUSTOMER_CACHE_ENABLED: "true"
      CONTRACT_SERVICE_CUSTOMER_CACHE_TTL_SECONDS: 1800
      CONTRACT_SERVICE_PRICE_CLIENT_MODE: http
      CONTRACT_SERVICE_PRICE_SERVICE_URL: http://price-service:8001/api/v1
      CONTRACT_SERVICE_REDIS_URL: redis://redis:6379/0
      CONTRACT_SERVICE_PRICE_CACHE_ENABLED: "true"
      CONTRACT_SERVICE_PRICE_CACHE_TTL_SECONDS: 300
      CONTRACT_SERVICE_IDENTITY_JWKS_URL: http://identity-service:8000/.well-known/jwks.json
      CONTRACT_SERVICE_JWT_ISSUER: identity-service
      CONTRACT_SERVICE_JWT_AUDIENCE: logistics-api
      CONTRACT_SERVICE_RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/%2F
      CONTRACT_SERVICE_RABBITMQ_ENABLED: "true"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:${CONTRACT_SERVICE_PORT:-8001}:8000"
    depends_on:
      contract-db:
        condition: service_healthy
      price-service:
        condition: service_started
      customer-service:
        condition: service_started
      redis:
        condition: service_started
      identity-service:
        condition: service_started
      rabbitmq:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.docker.network=lbm-gateway
      - traefik.http.routers.contract.rule=Host(`contract.localhost`) || PathPrefix(`/api/v1/contracts`)
      - traefik.http.routers.contract.entrypoints=web
      - traefik.http.services.contract.loadbalancer.server.port=8000
    networks:
      - gateway
      - contract-data

  customer-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CUSTOMER_DB_NAME:-customer_db}
      POSTGRES_USER: ${CUSTOMER_DB_USER:-customer_user}
      POSTGRES_PASSWORD: ${CUSTOMER_DB_PASSWORD:-customer_password}
    ports:
      - "127.0.0.1:${CUSTOMER_DB_PORT:-5437}:5432"
    volumes:
      - customer-db-data:/var/lib/postgresql/data
      - ../../services/customer-service/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - customer-data

  customer-service:
    build:
      context: ../../services/customer-service
    restart: unless-stopped
    environment:
      CUSTOMER_SERVICE_DATABASE_URL: postgresql+psycopg://${CUSTOMER_DB_USER:-customer_user}:${CUSTOMER_DB_PASSWORD:-customer_password}@customer-db:5432/${CUSTOMER_DB_NAME:-customer_db}
      CUSTOMER_SERVICE_IDENTITY_JWKS_URL: http://identity-service:8000/.well-known/jwks.json
      CUSTOMER_SERVICE_JWT_ISSUER: identity-service
      CUSTOMER_SERVICE_JWT_AUDIENCE: logistics-api
    ports:
      - "127.0.0.1:${CUSTOMER_SERVICE_PORT:-8006}:8000"
    depends_on:
      customer-db:
        condition: service_healthy
      identity-service:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.docker.network=lbm-gateway
      - traefik.http.routers.customer.rule=Host(`customer.localhost`) || PathPrefix(`/api/v1/customers`)
      - traefik.http.routers.customer.entrypoints=web
      - traefik.http.services.customer.loadbalancer.server.port=8000
    networks:
      - gateway
      - customer-data

  price-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PRICE_DB_NAME:-price_db}
      POSTGRES_USER: ${PRICE_DB_USER:-price_user}
      POSTGRES_PASSWORD: ${PRICE_DB_PASSWORD:-price_password}
    ports:
      - "127.0.0.1:${PRICE_DB_PORT:-5433}:5432"
    volumes:
      - price-db-data:/var/lib/postgresql/data
      - ../../services/price-service/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - price-data

  price-service:
    build:
      context: ../../services/price-service
    restart: unless-stopped
    environment:
      PRICE_DATABASE_URL: postgresql+psycopg://${PRICE_DB_USER:-price_user}:${PRICE_DB_PASSWORD:-price_password}@price-db:5432/${PRICE_DB_NAME:-price_db}
      PRICE_IDENTITY_JWKS_URL: http://identity-service:8000/.well-known/jwks.json
      PRICE_JWT_ISSUER: identity-service
      PRICE_JWT_AUDIENCE: logistics-api
      PRICE_RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/%2F
      PRICE_RABBITMQ_ENABLED: "true"
    ports:
      - "127.0.0.1:${PRICE_SERVICE_PORT:-8002}:8001"
    depends_on:
      price-db:
        condition: service_healthy
      identity-service:
        condition: service_started
      rabbitmq:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.docker.network=lbm-gateway
      - traefik.http.routers.price.rule=Host(`price.localhost`) || PathPrefix(`/api/v1/services`) || PathPrefix(`/api/v1/price-lists`)
      - traefik.http.routers.price.entrypoints=web
      - traefik.http.services.price.loadbalancer.server.port=8001
    networks:
      - gateway
      - price-data

  production-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PRODUCTION_DB_NAME:-production_db}
      POSTGRES_USER: ${PRODUCTION_DB_USER:-production_user}
      POSTGRES_PASSWORD: ${PRODUCTION_DB_PASSWORD:-production_password}
    ports:
      - "127.0.0.1:${PRODUCTION_DB_PORT:-5434}:5432"
    volumes:
      - production-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - production-data

  production-service:
    build:
      context: ../../services/production-service
    restart: unless-stopped
    environment:
      PRODUCTION_DATABASE_URL: postgresql+psycopg://${PRODUCTION_DB_USER:-production_user}:${PRODUCTION_DB_PASSWORD:-production_password}@production-db:5432/${PRODUCTION_DB_NAME:-production_db}
      PRODUCTION_CONTRACT_CLIENT_MODE: fake
      PRODUCTION_CONTRACT_SERVICE_URL: http://contract-service:8000
      PRODUCTION_IDENTITY_JWKS_URL: http://identity-service:8000/.well-known/jwks.json
      PRODUCTION_JWT_ISSUER: identity-service
      PRODUCTION_JWT_AUDIENCE: logistics-api
    ports:
      - "127.0.0.1:${PRODUCTION_SERVICE_PORT:-8003}:8000"
    depends_on:
      production-db:
        condition: service_healthy
      identity-service:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.docker.network=lbm-gateway
      - traefik.http.routers.production.rule=Host(`production.localhost`) || PathPrefix(`/api/v1/production-periods`)
      - traefik.http.routers.production.entrypoints=web
      - traefik.http.services.production.loadbalancer.server.port=8000
    networks:
      - gateway
      - production-data

  payment-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PAYMENT_DB_NAME:-payment_db}
      POSTGRES_USER: ${PAYMENT_DB_USER:-payment_user}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment_password}
    ports:
      - "127.0.0.1:${PAYMENT_DB_PORT:-5435}:5432"
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - payment-data

  payment-service:
    build:
      context: ../../services/payment-service
    restart: unless-stopped
    environment:
      PAYMENT_DATABASE_URL: postgresql+psycopg://${PAYMENT_DB_USER:-payment_user}:${PAYMENT_DB_PASSWORD:-payment_password}@payment-db:5432/${PAYMENT_DB_NAME:-payment_db}
      PAYMENT_USE_FAKE_CLIENTS: "true"
      PAYMENT_IDENTITY_JWKS_URL: http://identity-service:8000/.well-known/jwks.json
      PAYMENT_JWT_ISSUER: identity-service
      PAYMENT_JWT_AUDIENCE: logistics-api
      PAYMENT_RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/%2F
      PAYMENT_RABBITMQ_ENABLED: "true"
    ports:
      - "127.0.0.1:${PAYMENT_SERVICE_PORT:-8004}:8000"
    depends_on:
      payment-db:
        condition: service_healthy
      identity-service:
        condition: service_started
      rabbitmq:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.docker.network=lbm-gateway
      - traefik.http.routers.payment.rule=Host(`payment.localhost`) || PathPrefix(`/api/v1/payments`)
      - traefik.http.routers.payment.entrypoints=web
      - traefik.http.services.payment.loadbalancer.server.port=8000
    networks:
      - gateway
      - payment-data

volumes:
  identity-db-data:
  contract-db-data:
  customer-db-data:
  price-db-data:
  production-db-data:
  payment-db-data:
  redis-data:

networks:
  gateway:
    name: lbm-gateway
  identity-data:
    name: lbm-identity-data
  contract-data:
    name: lbm-contract-data
  customer-data:
    name: lbm-customer-data
  price-data:
    name: lbm-price-data
  production-data:
    name: lbm-production-data
  payment-data:
    name: lbm-payment-data
