services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: price_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - price_db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d price_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      PRICE_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/price_db
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy

volumes:
  price_db_data:
