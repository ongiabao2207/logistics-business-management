[project]
name = "contract-service"
version = "0.1.0"
description = "Contract Service for the Logistics Business Management System"
requires-python = ">=3.11"
dependencies = [
    "alembic",
    "fastapi",
    "psycopg[binary]",
    "sqlalchemy",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
namespaces = true
